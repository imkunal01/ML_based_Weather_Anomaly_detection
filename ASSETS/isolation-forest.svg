<text x="610" y="70" class="t">How Isolation Forest thinks</text>
<text x="610" y="100" class="s">It slices the data with random cuts.</text>
<text x="610" y="124" class="s">Normal points sit in a crowd, so they</text>
<text x="610" y="144" class="s">need lots of cuts before they're alone.</text>
<text x="610" y="176" class="s">The red outlier is alone after 1 or 2.</text>
<text x="610" y="200" class="s">Fewer cuts = higher anomaly score.</text>
<text x="610" y="240" class="s" fill="#facc15">dashed yellow lines = random cuts</text>
